<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answer Oracle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
  min-height:100vh;
  background:#0b0f1a;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 20px;
}
h1{
  margin-bottom:24px;
  font-size:32px;
  color:#c4b5fd;
  letter-spacing:2px;
}
.container{
  background:#171e35;
  padding:28px;
  border-radius:20px;
  width:100%;
  max-width:520px;
  box-shadow: 0 0 30px #7c3aed44;
}
#questionInput{
  width:100%;
  padding:14px 16px;
  border-radius:10px;
  border:none;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
  background:#242d48;
  color:#fff;
}
#questionInput::placeholder{
  color:#a5b4fc;
}
.btns{display:flex;gap:14px}
button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:500;
  cursor:pointer;
  transition: 0.2s;
}
#askBtn{
  background:#8b5cf6;
  color:#fff;
}
#askBtn:hover{
  background:#7c3aed;
  box-shadow:0 0 15px #8b5cf680;
}
#resetBtn{
  background:#334155;
  color:#fff;
}
#resetBtn:hover{
  background:#475569;
}
#hint{
  margin:20px 0 8px;
  color:#ddd6fe;
  text-align:center;
  min-height:24px;
}
#stage{
  width:100%;
  height:340px;
  margin-top:20px;
  border-radius:16px;
  background:#0f1629;
  position:relative;
  overflow:hidden;
}
/* 炸开飘散特效 */
.particle{
  position:absolute;
  color:#f0abfc;
  font-weight:500;
  white-space:nowrap;
  animation: burst 2.2s ease-out forwards;
}
@keyframes burst{
  0%{
    opacity:1;
    transform: translate(0,0) scale(1);
  }
  100%{
    opacity:0;
    transform: translate(var(--tx), var(--ty)) scale(0.25);
  }
}
</style>
</head>
<body>
<h1>🔮 Answer Oracle</h1>
<div class="container">
  <input id="questionInput" placeholder="Type your question here...">
  <div class="btns">
    <button id="askBtn">Ask & Reveal</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div id="hint"></div>
</div>
<div id="stage"></div>

<script>
const input = document.getElementById('questionInput');
const askBtn = document.getElementById('askBtn');
const resetBtn = document.getElementById('resetBtn');
const hint = document.getElementById('hint');
const stage = document.getElementById('stage');

// 随机预言回答库，可以自己增删
const answers = [
  "Yes, the odds are in your favour.",
  "Not right now, wait a little longer.",
  "Trust your intuition, it will guide you.",
  "The path ahead is full of surprises.",
  "It may be harder than you expect.",
  "Absolutely, keep moving forward.",
  "Uncertain at this moment, try again later.",
  "What you seek will come in time.",
  "Do not hesitate, take the chance.",
  "Better to hold back for now."
];

askBtn.onclick = ()=>{
  const q = input.value.trim();
  if(!q){
    hint.textContent = "Please type your question first!";
    return;
  }
  hint.textContent = "The oracle speaks...";
  const picked = answers[Math.floor(Math.random() * answers.length)];
  createBurstText(picked);
  input.value = "";
}

resetBtn.onclick = ()=>{
  input.value = "";
  hint.textContent = "";
  stage.innerHTML = "";
}

// 炸开特效函数
function createBurstText(text){
  stage.innerHTML = "";
  const cx = stage.clientWidth / 2;
  const cy = stage.clientHeight / 2;

  // 拆成单个字符，向不同方向飞出去
  for(let i=0; i < text.length; i++){
    const span = document.createElement('span');
    span.className = "particle";
    span.innerText = text[i];

    // 随机方向、距离
    const angle = (Math.PI * 2 / text.length) * i + Math.random()*0.4;
    const dist = 60 + Math.random() * 130;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist - 80;

    span.style.setProperty('--tx', tx + "px");
    span.style.setProperty('--ty', ty + "px");
    span.style.left = cx + "px";
    span.style.top = cy + "px";
    span.style.transform = "translate(-50%,-50%)";
    stage.appendChild(span);
  }
}
</script>
</body>
</html>
