<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mystic Oracle</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(168, 85, 247, 0.45), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.35), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.45), transparent 40%),
      #07081a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  h1 {
    font-size: 36px;
    letter-spacing: 6px;
    color: #fff;
    text-shadow:
      0 0 12px #c084fc,
      0 0 24px #ec4899,
      0 0 48px #7c3aed;
    margin-bottom: 30px;
  }

  .panel {
    background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.14);
    padding: 30px;
    border-radius: 26px;
    width: 100%;
    max-width: 560px;
    box-shadow:
      0 0 40px rgba(124, 58, 237, 0.45),
      0 15px 45px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
  }

  #questionInput {
    width: 100%;
    padding: 16px 18px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-size: 16px;
    outline: none;
    margin-bottom: 20px;
    transition: 0.3s;
  }

  #questionInput:focus {
    border-color: #c084fc;
    box-shadow: 0 0 0 4px rgba(192, 132, 252, 0.35);
  }

  #questionInput::placeholder {
    color: #c4b5fd;
  }

  .row {
    display: flex;
    gap: 14px;
  }

  button {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    transition: 0.25s;
  }

  #askBtn {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    box-shadow: 0 12px 30px rgba(168, 85, 247, 0.55);
  }

  #askBtn:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 36px rgba(236, 72, 153, 0.65);
  }

  #askBtn:disabled {
    background: #475569;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  #resetBtn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
  }

  #resetBtn:hover {
    background: rgba(255,255,255,0.16);
  }

  #status {
    margin-top: 22px;
    text-align: center;
    min-height: 26px;
    color: #ddd6fe;
    font-size: 15px;
    letter-spacing: 2px;
  }

  #stage {
    position: relative;
    width: 100%;
    max-width: 760px;
    height: 420px;
    margin-top: 26px;
    border-radius: 26px;
    background:
      radial-gradient(circle at center, rgba(99, 102, 241, 0.3), transparent 55%),
      rgba(10, 12, 35, 0.92);
    border: 1px solid rgba(255,255,255,0.12);
    overflow: hidden;
    box-shadow: inset 0 0 80px rgba(168, 85, 247, 0.35);
  }

  #stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 75%);
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px #c084fc, 0 0 22px #ec4899;
    pointer-events: none;
    animation: particleRise linear infinite;
  }

  .scan {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #c084fc, #ec4899, #c084fc, transparent);
    box-shadow: 0 0 18px #c084fc;
    animation: scanMove 2.4s linear infinite;
    opacity: 0;
  }

  .orb {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #fff 0%, #f0abfc 20%, #a855f7 45%, #1e1b4b 70%, transparent 80%);
    transform: translate(-50%, -50%) scale(0.6);
    box-shadow:
      0 0 40px #a855f7,
      0 0 80px #ec4899,
      inset 0 0 30px rgba(255,255,255,0.4);
    opacity: 0;
    animation: orbOpen 1.6s ease-out forwards;
    pointer-events: none;
  }

  .ring {
    position: absolute;
    left: 50%;
    top: 42%;
    border-radius: 50%;
    border: 2px solid rgba(192, 132, 252, 0.7);
    transform: translate(-50%, -50%) scale(0.3);
    opacity: 0;
    animation: ringPulse 1.8s ease-out forwards;
    pointer-events: none;
  }

  .answer-card {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%) scale(0.55);
    width: 86%;
    max-width: 520px;
    padding: 26px 30px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(17, 24, 39, 0.96), rgba(88, 28, 135, 0.96));
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow:
      0 0 40px rgba(168, 85, 247, 0.6),
      0 20px 60px rgba(0, 0, 0, 0.7);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    animation: cardReveal 2s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .answer-card h2 {
    font-size: 13px;
    letter-spacing: 6px;
    color: #c4b5fd;
    margin-bottom: 14px;
  }

  .answer-card p {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.5;
    color: #fff;
    text-shadow: 0 0 12px rgba(255,255,255,0.4);
    min-height: 3.3em;
  }

  .answer-card.gold {
    border-color: #fde68a;
    box-shadow:
      0 0 50px rgba(253, 224, 71, 0.7),
      0 0 100px rgba(236, 72, 153, 0.45);
  }

  .answer-card.blue {
    border-color: #38bdf8;
    box-shadow:
      0 0 50px rgba(56, 189, 248, 0.7),
      0 0 100px rgba(59, 130, 246, 0.45);
  }

  .cursor {
    display: inline-block;
    width: 10px;
    background: #c084fc;
    margin-left: 4px;
    animation: blink 0.7s infinite;
  }

  @keyframes particleRise {
    0% {
      transform: translateY(0) scale(0.4);
      opacity: 0;
    }
    15% {
      opacity: 1;
    }
    100% {
      transform: translateY(-420px) scale(1);
      opacity: 0;
    }
  }

  @keyframes scanMove {
    0% { top: 0; opacity: 0; }
    15% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  @keyframes orbOpen {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    30% { opacity: 1; }
    60% { transform: translate(-50%, -50%) scale(1.15); }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  @keyframes ringPulse {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
  }

  @keyframes cardReveal {
    0% { transform: translate(-50%, -50%) scale(0.4) rotate(-6deg); opacity: 0; }
    40% { transform: translate(-50%, -50%) scale(1.12) rotate(2deg); opacity: 1; }
    55% { transform: translate(-50%, -50%) scale(0.97) rotate(-1deg); }
    70% { transform: translate(-50%, -50%) scale(1.04) rotate(1deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes shake {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    20% { transform: translate(-51%, -49%) scale(1.03); }
    40% { transform: translate(-49%, -51%) scale(1.02); }
    60% { transform: translate(-50%, -48%) scale(1.04); }
    80% { transform: translate(-49%, -50%) scale(1.02); }
  }
</style>
</head>

<body>
  <h1>🔮 MYSTIC ORACLE</h1>

  <div class="panel">
    <input id="questionInput" placeholder="Ask the oracle anything..." />
    <div class="row">
      <button id="askBtn">Reveal Answer</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="stage"></div>

<script>
  const input = document.getElementById("questionInput");
  const askBtn = document.getElementById("askBtn");
  const resetBtn = document.getElementById("resetBtn");
  const status = document.getElementById("status");
  const stage = document.getElementById("stage");

  const answers = [
    { text: "Yes, the universe aligns in your favour.", type: "gold" },
    { text: "Not yet. Wait for the right moment.", type: "blue" },
    { text: "Trust your intuition—it will guide you home.", type: "gold" },
    { text: "The path is uncertain. Ask again later.", type: "blue" },
    { text: "Go forward. This choice carries power.", type: "gold" },
    { text: "It is wiser to pause and reflect.", type: "blue" },
    { text: "Something surprising is about to happen.", type: "gold" },
    { text: "Be patient. Results take time to ripen.", type: "blue" },
    { text: "You already know the answer you seek.", type: "gold" },
    { text: "Let go of fear. The way is opening.", type: "gold" }
  ];

  askBtn.addEventListener("click", () => {
    const question = input.value.trim();

    if (!question) {
      status.textContent = "Please ask a question first.";
      return;
    }

    status.textContent = "The oracle is decoding...";
    askBtn.disabled = true;
    stage.innerHTML = "";

    startMysticSequence();
  });

  resetBtn.addEventListener("click", () => {
    input.value = "";
    status.textContent = "";
    stage.innerHTML = "";
    askBtn.disabled = false;
  });

  function startMysticSequence() {
    const rect = stage.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;

    // 1. 背景粒子雨
    for (let i = 0; i < 30; i++) {
      setTimeout(() => spawnParticle(cx, cy), i * 120);
    }

    // 2. 扫描线
    const scan = document.createElement("div");
    scan.className = "scan";
    stage.appendChild(scan);

    // 3. 占卜水晶球打开
    setTimeout(() => {
      const orb = document.createElement("div");
      orb.className = "orb";
      stage.appendChild(orb);

      for (let i = 1; i <= 4; i++) {
        const ring = document.createElement("div");
        ring.className = "ring";
        ring.style.width = (90 + i * 50) + "px";
        ring.style.height = (90 + i * 50) + "px";
        ring.style.animationDelay = (i * 0.18) + "s";
        stage.appendChild(ring);
      }
    }, 400);

    // 4. 随机抽取答案并打字显示
    setTimeout(() => {
      const answer = answers[Math.floor(Math.random() * answers.length)];
      showAnswerCard(answer);
    }, 1600);
  }

  function spawnParticle(cx, cy) {
    const p = document.createElement("div");
    p.className = "particle";

    p.style.left = Math.random() * 760 + "px";
    p.style.top = 420 + "px";
    p.style.animationDuration = (2 + Math.random() * 2) + "s";
    p.style.animationDelay = "0s";

    stage.appendChild(p);

    setTimeout(() => p.remove(), 4000);
  }

  function showAnswerCard(answer) {
    const card = document.createElement("div");
    card.className = "answer-card " + answer.type;
    card.innerHTML = `
      <h2>THE ORACLE SAYS</h2>
      <p id="answerText"></p>
    `;
    stage.appendChild(card);

    const answerText = document.getElementById("answerText");
    let i = 0;

    function typeNextChar() {
      if (i < answer.text.length) {
        answerText.innerHTML = answer.text.substring(0, i + 1) + `<span class="cursor"></span>`;
        i++;
        setTimeout(typeNextChar, 90);
      } else {
        answerText.innerHTML = answer.text;
        status.textContent = "✨ " + answer.text;
        askBtn.disabled = false;

        // 卡片轻微震动
        card.style.animation = "none";
        void card.offsetWidth;
        card.style.animation = "shake 0.6s ease-in-out";

        // 最终爆发粒子
        burstParticles();
      }
    }

    setTimeout(typeNextChar, 400);
  }

  function burstParticles() {
    const rect = stage.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;

    const colors = ["#fde68a", "#c084fc", "#38bdf8", "#f472b6", "#fff"];

    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.boxShadow = `0 0 12px ${p.style.background}`;

        const angle = Math.random() * Math.PI * 2;
        const dist = 180 + Math.random() * 260;

        p.style.left = cx + "px";
        p.style.top = cy + "px";

        p.style.animation = "none";
        void p.offsetWidth;

        p.style.animation = "particleBurst 1.6s ease-out forwards";
        p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
        p.style.setProperty("--ty", Math.sin(angle) * dist + "px");

        stage.appendChild(p);
        setTimeout(() => p.remove(), 1700);
      }, i * 40);
    }
  }
</script>
</body>
</html>
